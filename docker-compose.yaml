# Test compilation against some popular Linux distros
#   docker compose --profile stable build
#   docker compose --profile latest build

x-umurmur: &umurmur
  depends_on:
    cert-init:
      condition: service_completed_successfully
  volumes:
    - umurmur-certs:/etc/umurmur:ro

services:
  cert-init:
    image: alpine:latest
    command:
      - /bin/sh
      - -ec
      - |
        apk add --no-cache openssl
        if [ ! -s /certs/certificate.crt ] || [ ! -s /certs/private_key.key ]; then
          openssl req -x509 -newkey rsa:2048 -sha256 -days 3650 -nodes \
            -keyout /certs/private_key.key \
            -out /certs/certificate.crt \
            -subj "/CN=umurmur"
        fi
    volumes:
      - umurmur-certs:/certs
    restart: "no"

  alpine-stable-gnutls:
    <<: *umurmur
    profiles: [alpine, stable]
    build:
      context: .
      dockerfile: Dockerfile.alpine
      args:
        BASE_IMAGE: alpine:3.24
        SSL: gnutls

  alpine-stable-mbedtls:
    <<: *umurmur
    profiles: [alpine, stable]
    build:
      context: .
      dockerfile: Dockerfile.alpine
      args:
        BASE_IMAGE: alpine:3.24
        SSL: mbedtls

  alpine-stable-openssl:
    <<: *umurmur
    profiles: [alpine, stable]
    build:
      context: .
      dockerfile: Dockerfile.alpine
      args:
        BASE_IMAGE: alpine:3.24
        SSL: openssl

  debian-stable-gnutls:
    <<: *umurmur
    profiles: [debian, stable]
    build:
      context: .
      dockerfile: Dockerfile.debian
      args:
        BASE_IMAGE: debian:stable-slim
        SSL: gnutls

  debian-stable-mbedtls:
    <<: *umurmur
    profiles: [debian, stable]
    build:
      context: .
      dockerfile: Dockerfile.debian
      args:
        BASE_IMAGE: debian:stable-slim
        SSL: mbedtls

  debian-stable-openssl:
    <<: *umurmur
    profiles: [debian, stable]
    build:
      context: .
      dockerfile: Dockerfile.debian
      args:
        BASE_IMAGE: debian:stable-slim
        SSL: openssl

  alpine-latest-gnutls:
    <<: *umurmur
    profiles: [alpine, latest]
    build:
      context: .
      dockerfile: Dockerfile.alpine
      args:
        BASE_IMAGE: alpine:latest
        SSL: gnutls

  alpine-latest-mbedtls:
    <<: *umurmur
    profiles: [alpine, latest]
    build:
      context: .
      dockerfile: Dockerfile.alpine
      args:
        BASE_IMAGE: alpine:latest
        SSL: mbedtls

  alpine-latest-openssl:
    <<: *umurmur
    profiles: [alpine, latest]
    build:
      context: .
      dockerfile: Dockerfile.alpine
      args:
        BASE_IMAGE: alpine:latest
        SSL: openssl

  debian-unstable-gnutls:
    <<: *umurmur
    profiles: [debian, latest]
    build:
      context: .
      dockerfile: Dockerfile.debian
      args:
        BASE_IMAGE: debian:unstable-slim
        SSL: gnutls

  debian-unstable-mbedtls:
    <<: *umurmur
    profiles: [debian, latest]
    build:
      context: .
      dockerfile: Dockerfile.debian
      args:
        BASE_IMAGE: debian:unstable-slim
        SSL: mbedtls

  debian-unstable-openssl:
    <<: *umurmur
    profiles: [debian, latest]
    build:
      context: .
      dockerfile: Dockerfile.debian
      args:
        BASE_IMAGE: debian:unstable-slim
        SSL: openssl

volumes:
  umurmur-certs:
